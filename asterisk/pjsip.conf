; SIP-trunk naar CheapConnect (pjsip).
;
; De plaatshouders __TRUNK_NUMMER__, __TRUNK_WACHTWOORD__ en
; __CHEAPCONNECT_HOST__ worden bij de installatie ingevuld uit /etc/jarvis/jarvis.env.
;
; Thuis zit deze container achter NAT. Uitgaand bellen werkt dan meteen: de
; registratie houdt het gat in de firewall open en rtp_symmetric zorgt dat de
; media terugkomt waar hij vandaan kwam. Voor inkomend bellen moet je op je
; router UDP 5060 en UDP 10000-10200 naar deze container doorsturen.

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
local_net=192.168.1.0/24
; CheapConnect reserveert de naam "asterisk" op hun platform: meldt de PBX zich
; met de standaardnaam, dan kan de registratie geweigerd worden. Vandaar een
; eigen naam.
user_agent=JarvisPBX

[cheapconnect]
type=endpoint
transport=transport-udp
context=from-trunk
disallow=all
allow=alaw
allow=ulaw
outbound_auth=cheapconnect-auth
aors=cheapconnect-aor
from_user=__TRUNK_NUMMER__
from_domain=__CHEAPCONNECT_HOST__
callerid=Jarvis <__TRUNK_NUMMER__>
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
direct_media=no
dtmf_mode=rfc4733
timers=no
ice_support=no
media_use_received_transport=yes

[cheapconnect-auth]
type=auth
auth_type=userpass
username=__TRUNK_NUMMER__
password=__TRUNK_WACHTWOORD__

[cheapconnect-aor]
type=aor
contact=sip:__CHEAPCONNECT_HOST__:5060
qualify_frequency=60
qualify_timeout=5
max_contacts=1
remove_existing=yes

[cheapconnect-identify]
type=identify
endpoint=cheapconnect
match=__CHEAPCONNECT_HOST__

[cheapconnect-reg]
type=registration
transport=transport-udp
outbound_auth=cheapconnect-auth
server_uri=sip:__CHEAPCONNECT_HOST__:5060
client_uri=sip:__TRUNK_NUMMER__@__CHEAPCONNECT_HOST__
retry_interval=60
forbidden_retry_interval=600
expiration=3600
line=yes
endpoint=cheapconnect