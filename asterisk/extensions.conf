; Draaiboek van de telefoonlijn.
;
; __SOCKET__ wordt bij de installatie het adres van jarvisd (standaard
; 127.0.0.1:9092).
;
; Twee routes:
;   from-trunk   - Tom (of iemand anders) belt het trunk-nummer: meteen Jarvis.
;   jarvis-melding - Jarvis belt Tom: melding voorlezen, daarna keuze 1 = praten.

[globals]
JARVIS_SOCKET=__SOCKET__

[from-trunk]
exten => _X.,1,NoOp(Jarvis: inkomend gesprek van ${CALLERID(num)})
 same => n,Answer()
 same => n,Set(GESPREK=${UUID()})
 same => n,AudioSocket(${GESPREK},${JARVIS_SOCKET})
 same => n,Hangup()

[from-internal]
exten => _X.,1,NoOp(Jarvis: testoproep naar ${EXTEN})
 same => n,Answer()
 same => n,Set(GESPREK=${UUID()})
 same => n,AudioSocket(${GESPREK},${JARVIS_SOCKET})
 same => n,Hangup()

; --- Jarvis belt Tom met een melding -------------------------------------
[jarvis-melding]
exten => s,1,NoOp(Jarvis: melding ${JARVIS_MELDING})
 same => n,Answer()
 same => n,Wait(1)
 same => n,GotoIf($["${JARVIS_MELDING}"=""]?geenmelding)
 same => n,Playback(/var/lib/asterisk/sounds/jarvis/${JARVIS_MELDING})
 same => n,Read(KEUZE,,1,,1,6)
 same => n,GotoIf($["${KEUZE}"="1"]?gesprek)
 same => n,Playback(goodbye)
 same => n,Hangup()
 same => n(gesprek),Set(GESPREK=${UUID()})
 same => n,AudioSocket(${GESPREK},${JARVIS_SOCKET})
 same => n,Hangup()
 same => n(geenmelding),Playback(goodbye)
 same => n,Hangup()

; --- Jarvis belt Tom om te praten (testknop) -----------------------------
[jarvis-gesprek]
exten => s,1,NoOp(Jarvis: gesprek op verzoek)
 same => n,Answer()
 same => n,Set(GESPREK=${UUID()})
 same => n,AudioSocket(${GESPREK},${JARVIS_SOCKET})
 same => n,Hangup()